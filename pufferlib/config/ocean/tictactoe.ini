[base]
package = ocean
env_name = puffer_tictactoe
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 1

[vec]
backend = Multiprocessing
num_envs = 8 
num_workers = auto
batch_size = auto
zero_copy = True

[train]
total_timesteps = 20_000_000 
minibatch_size = 32768 
max_minibatch_size = 32768
batch_size = 262144
bptt_horizon = 64
gamma = 0.95
checkpoint_interval = 500
max_checkpoints = 24

[league]
enabled = True
snapshot_interval = 10_000
snapshot_min_games = 128
pool_probability = 0.6
max_snapshots = 12
elo_k = 32.0
opponent_device = cuda
hero_start_elo = 1000.0
