[base]
package = ocean
env_name = puffer_tictactoe
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 4096

[vec]
num_envs = 8

[train]
total_timesteps = 300_000_000
learning_rate = 0.0003
anneal_lr = True
gamma = 0.995
gae_lambda = 0.95
clip_coef = 0.2
ent_coef = 0.02
vf_coef = 1.0
update_epochs = 8
minibatch_size = 2048
max_grad_norm = 1.0
target_kl = 0.02
bptt_horizon = 64
device = mps
