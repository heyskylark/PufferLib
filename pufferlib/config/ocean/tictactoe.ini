[base]
package = ocean
env_name = puffer_tictactoe
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 1
random_open_prob = 0.2
random_open_depth = 2

[vec]
backend = Multiprocessing
num_envs = 8 
num_workers = auto
batch_size = auto
zero_copy = True

[train]
total_timesteps = 25_000_000 
learning_rate = 0.005
minibatch_size = 32768 
max_minibatch_size = 32768
batch_size = 262144
bptt_horizon = 64
update_epochs = 2
gamma = 0.95
vf_coef = 3.0
ent_coef = 0.008
checkpoint_interval = 500
max_checkpoints = 24

[league]
enabled = True
snapshot_interval = 10_000
snapshot_min_games = 128
pool_probability = 0.2
ent_coef = 0.01210084358004069
max_snapshots = 250
elo_k = 32.0
opponent_device = cuda
hero_start_elo = 1000.0

[sweep]
metric = episode_return
goal = maximize

[sweep.train.learning_rate]
distribution = uniform
min = 0.003
max = 0.006
mean = 0.0045
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 2.0
max = 4.0
mean = 3.0
scale = auto

[sweep.train.ent_coef]
distribution = uniform
min = 0.006
max = 0.010
mean = 0.008
scale = auto
