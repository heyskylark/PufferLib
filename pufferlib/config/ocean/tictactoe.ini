[base]
package = ocean
env_name = puffer_tictactoe
policy_name = TicTacToe
rnn_name = None 

[env]
random_open_prob = 0.1
random_open_depth = 3

[vec]
backend = Multiprocessing
num_envs = 512
num_workers = 8
batch_size = 256 
zero_copy = True

[train]
total_timesteps = 200_000_000 
learning_rate = 0.08
minibatch_size = 32768 
max_minibatch_size = 32768
batch_size = 262144
bptt_horizon = 32 
update_epochs = 2
vf_coef = 2.37
ent_coef = 0.05
checkpoint_interval = 25000
max_checkpoints = 24
gamma = 0.99
gae_lambda = 1.0 

[league]
enabled = True 
snapshot_interval = 50_000
snapshot_min_games = 512
pool_probability = 0.2
max_snapshots = 250
elo_k = 16.0
opponent_device = cuda
hero_start_elo = 1000.0

[sweep]
metric = episode_return
goal = maximize

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e7
max = 2e8
mean = 8e7
scale = auto

[sweep.train.learning_rate]
distribution = uniform
min = 0.003
max = 0.006
mean = 0.0045
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 2.0
max = 4.0
mean = 3.0
scale = auto

[sweep.train.ent_coef]
distribution = uniform
min = 0.006
max = 0.010
mean = 0.008
scale = auto
